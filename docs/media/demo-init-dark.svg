<svg xmlns="http://www.w3.org/2000/svg" width="784" height="416" viewBox="0 0 784 416" role="img" aria-label="asnsim init: terminal output">
<title>asnsim init</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;white-space:pre}
.t{opacity:0;animation:show 0.01s linear forwards}
.caret{opacity:0;animation:blink 1.1s step-end infinite}
@keyframes show{to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.t{animation:none;opacity:1}.caret{animation:none;opacity:1}}
</style>
<rect width="784" height="416" fill="#0D1117"/>
<rect x="0.5" y="0.5" width="783" height="415" rx="10" fill="#04111F" stroke="#1C3557"/>
<path d="M0.5 34V10.5a10 10 0 0 1 10-10h763a10 10 0 0 1 10 10V34z" fill="#0B1626"/>
<line x1="0.5" y1="34" x2="783.5" y2="34" stroke="#1C3557"/>
<circle cx="20" cy="17" r="6" fill="#0A84FF"/><circle cx="40" cy="17" r="6" fill="#64D2FF"/><circle cx="60" cy="17" r="6" fill="#1C3557"/>
<text x="392" y="22" text-anchor="middle" fill="#8FA3BC" style="font-size:12px">asnsim init</text>
<text x="20" y="67" fill="#8FA3BC"># a test chain for com.example.app in .asnsim/</text>
<text x="20" y="86"><tspan fill="#0A84FF" font-weight="700">$ </tspan><tspan fill="#D0E2F7"><tspan class="t" style="animation-delay:0.40s">a</tspan><tspan class="t" style="animation-delay:0.45s">s</tspan><tspan class="t" style="animation-delay:0.49s">n</tspan><tspan class="t" style="animation-delay:0.54s">s</tspan><tspan class="t" style="animation-delay:0.58s">i</tspan><tspan class="t" style="animation-delay:0.63s">m</tspan><tspan class="t" style="animation-delay:0.67s"> </tspan><tspan class="t" style="animation-delay:0.72s">i</tspan><tspan class="t" style="animation-delay:0.76s">n</tspan><tspan class="t" style="animation-delay:0.80s">i</tspan><tspan class="t" style="animation-delay:0.85s">t</tspan></tspan></text>
<text class="t" x="20" y="105" style="animation-delay:1.40s"><tspan fill="#D0E2F7">Wrote a test chain for com.example.app (Sandbox) to .asnsim/:</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:1.43s"><tspan fill="#D0E2F7">  root.cer</tspan></text>
<text class="t" x="20" y="143" style="animation-delay:1.47s"><tspan fill="#D0E2F7">  root.pem</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:1.50s"><tspan fill="#D0E2F7">  intermediate.pem</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:1.54s"><tspan fill="#D0E2F7">  signing.pem</tspan></text>
<text class="t" x="20" y="200" style="animation-delay:1.57s"><tspan fill="#D0E2F7">  signing-key.pem</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:1.60s"><tspan fill="#D0E2F7">  asnsim.json</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:1.64s"><tspan fill="#D0E2F7">  .gitignore</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:1.68s"></text>
<text class="t" x="20" y="276" style="animation-delay:1.71s"><tspan fill="#D0E2F7">Next:</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:1.75s"><tspan fill="#D0E2F7">  1. In your backend's tests, give Apple's SignedDataVerifier .asnsim/root.cer as the root,</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:1.78s"><tspan fill="#D0E2F7">     with online checks off. Never in production: it trusts this test chain.</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:1.81s"><tspan fill="#D0E2F7">  2. Start the backend, then send notifications:</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:1.85s"><tspan fill="#D0E2F7">       asnsim run trial-renew-refund --url http://localhost:3000/notifications</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:1.89s"><tspan fill="#D0E2F7">  Guide: https://github.com/muhittincamdali/asnsim/blob/main/docs/guides/trust-the-test-root.md</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:2.12s"><tspan fill="#0A84FF" font-weight="700">$ </tspan></text>
<rect class="caret" x="35.66" y="378" width="7.83" height="16" fill="#0A84FF" style="animation-delay:2.12s"/>
</svg>
