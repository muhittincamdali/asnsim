<text class="t" x="20" y="105" style="animation-delay:5.36s"><tspan fill="#00285C" font-weight="700">asnsim · refund-keeps-access → http://127.0.0.1:3000/notifications</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:5.39s"><tspan fill="#0B1F33">A check that fails on purpose: after a refund the receiver turns access off, and this scenario</tspan></text>
<text class="t" x="20" y="143" style="animation-delay:5.43s"><tspan fill="#0B1F33">expects it to stay on, to show what a failed check looks like.</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:5.46s"><tspan fill="#5A6B80">Sandbox · com.example.app · dated when sent</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:5.50s"></text>
<text class="t" x="20" y="200" style="animation-delay:5.53s"><tspan fill="#0B1F33">  1  </tspan><tspan fill="#00285C" font-weight="700">SUBSCRIBED/INITIAL_BUY                  </tspan><tspan fill="#0B1F33">       200    15 ms  </tspan><tspan fill="#0071E3">ok</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:5.57s"><tspan fill="#0B1F33">  2  </tspan><tspan fill="#00285C" font-weight="700">REFUND                                  </tspan><tspan fill="#0B1F33">       200     2 ms  </tspan><tspan fill="#00285C">failed</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:5.60s"><tspan fill="#0B1F33">       </tspan><tspan fill="#5A6B80">check GET http://127.0.0.1:3000/entitlements/:id → 200</tspan><tspan fill="#0B1F33"> </tspan><tspan fill="#00285C">failed</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:5.64s"><tspan fill="#0B1F33">       </tspan><tspan fill="#00285C">check-failed</tspan><tspan fill="#0B1F33">: The check GET http://127.0.0.1:3000/entitlements/:id did not match: $.active:</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:5.67s"><tspan fill="#0B1F33">       expected true, got false.</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:5.71s"><tspan fill="#0B1F33">       How to fix:</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:5.74s"><tspan fill="#0B1F33">       - REFUND: The App Store refunded or revoked the purchase.</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:5.78s"><tspan fill="#0B1F33">       - The backend did not reach the state the step checks for. The guide lists what each</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:5.81s"><tspan fill="#0B1F33">         notification means for access.</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:5.85s"><tspan fill="#0B1F33">       </tspan><tspan fill="#0058D4">https://github.com/muhittincamdali/asnsim/blob/main/docs/guides/troubleshooting.md#check-failed</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:5.88s"></text>
<text class="t" x="20" y="409" style="animation-delay:5.92s"><tspan fill="#00285C">1 of 2 notifications passed · 1 failed · 3 requests</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:6.15s"><tspan fill="#0071E3" font-weight="700">$ </tspan></text>
