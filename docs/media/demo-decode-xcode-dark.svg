<text class="t" x="20" y="694" style="animation-delay:5.50s"><tspan fill="#D0E2F7">    Apple’s SignedDataVerifier does when it is set up for the Xcode environment.</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:5.53s"><tspan fill="#D0E2F7">    Fix: Xcode signs StoreKit Testing data with its own key, so nothing proves where it came from.</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:5.57s"><tspan fill="#D0E2F7">    Use it only in tests; a server must not accept environment Xcode.</tspan></text>
