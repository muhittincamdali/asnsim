# Runs asnsim against your backend on every pull request that touches it: the backend starts with
# the asnsim test root, then asnsim plays the scenarios and fails the job when a notification is
# rejected or a check does not match. Copy to .github/workflows/ and adjust the three marked lines.
name: App Store notifications

on:
  pull_request:
    paths:
      - 'server/**' # 1. the backend's folder

permissions:
  contents: read

jobs:
  asnsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install asnsim from its GitHub release
        run: npm install --global https://github.com/muhittincamdali/asnsim/releases/download/v0.1.1/asnsim-0.1.1.tgz

      - name: Create the test chain
        run: asnsim init --bundle-id com.example.app # 2. your bundle ID

      - name: Start the backend with the test root
        env:
          ASN_TEST_ROOT: .asnsim/root.cer
        run: |
          npm --prefix server ci
          npm --prefix server start > server.log 2>&1 &   # 3. how your backend starts
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/health && break
            sleep 1
          done

      - name: Play the scenarios
        run: |
          status=0
          for scenario in trial-renew-refund billing-retry-grace-recovery consumable-refund-dispute; do
            asnsim run "$scenario" --url http://127.0.0.1:3000/notifications --duplicate \
              --format markdown >> "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status

      - name: Server log
        if: failure()
        run: cat server.log
